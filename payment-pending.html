<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex, nofollow">
  <title>Temporarily Unavailable | Evelyn Kavindu</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #080808;
      --panel: #11100f;
      --text: #eeeae3;
      --muted: #aaa49b;
      --gold: #cda34a;
      --gold-dark: #986f22;
      --line: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background:
        radial-gradient(circle at 15% 15%, rgba(205, 163, 74, 0.12), transparent 30%),
        linear-gradient(145deg, #080808 0%, #11100f 58%, #080808 100%);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(34px, 8vw, 76px) clamp(24px, 8vw, 76px);
      border: 1px solid var(--line);
      background: rgba(17, 16, 15, 0.84);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      animation: reveal 700ms ease both;
    }

    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 30px;
      background: linear-gradient(150deg, var(--gold), var(--gold-dark));
      color: #080808;
      font: 700 18px/1 Arial, sans-serif;
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font: 600 11px/1.4 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto 20px;
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .message {
      max-width: 44ch;
      margin: 0 auto;
      color: var(--muted);
      font: 16px/1.7 Arial, sans-serif;
    }

    .rule {
      width: 54px;
      height: 1px;
      margin: 34px auto;
      background: var(--gold);
    }

    .note {
      margin: 0;
      color: var(--text);
      font: 14px/1.6 Arial, sans-serif;
    }

    .footer {
      margin: 36px 0 0;
      color: #746f68;
      font: 12px/1.5 Arial, sans-serif;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">EK</div>
    <p class="eyebrow">Temporarily unavailable</p>
    <h1>We’ll be back shortly.</h1>
    <p class="message">
      This website is temporarily offline while account payment verification is being completed with Vercel.
    </p>
    <div class="rule" aria-hidden="true"></div>
    <p class="note">Thank you for your patience. Please check back soon.</p>
    <p class="footer">Evelyn Kavindu &middot; Film Editor &amp; Filmmaker</p>
  </main>
</body>
</html>
